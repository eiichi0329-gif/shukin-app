<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>集金管理アプリ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">&#128203;</div>
            <h2 class="login-title">集金管理アプリ</h2>
            <p class="login-desc">Googleアカウントでログインしてください</p>
            <div id="google-signin-btn"></div>
            <p id="login-error" class="login-error hidden"></p>
        </div>
    </div>

    <div id="app" class="hidden">

        <!-- ヘッダー -->
        <div class="app-header">
            <div class="header-top">
                <h1>集金管理アプリ</h1>
                <span class="month-badge" id="month-badge">—</span>
                <span id="loading-badge" style="background:rgba(255,255,255,0.25);border-radius:20px;padding:3px 10px;font-size:13px;margin-left:auto">読込中...</span>
                <div class="header-user" id="header-user">
                    <img id="user-avatar" class="user-avatar" src="" alt="">
                    <button class="btn-logout" onclick="logout()" title="ログアウト">ログアウト</button>
                </div>
            </div>
        </div>

        <!-- コントロール -->
        <div class="controls-bar">
            <div class="controls-top">
                <div class="filter-row">
                    <div class="search-wrap">
                        <input id="search-input" type="text" placeholder="名前・住所で検索...">
                    </div>
                    <select id="filter-store"   class="sel-filter"></select>
                    <select id="filter-month"   class="sel-filter"></select>
                    <select id="filter-route"   class="sel-filter"></select>
                    <select id="filter-payment" class="sel-filter">
                        <option value="">全支払</option>
                        <option value="cash">現金</option>
                        <option value="bank">口振</option>
                    </select>
                    <label class="toggle-label">
                        <input id="toggle-uncollected" type="checkbox">
                        未集金のみ
                    </label>
                </div>
                <button class="btn btn-admin-toggle" id="btn-admin-toggle" onclick="toggleAdminActions()">&#9881;</button>
            </div>
            <div class="action-row hidden" id="action-row">
                <div class="action-wrap">
                    <button class="btn btn-bulk"          id="btn-bulk-check"    onclick="checkAllBank()">&#10003; 一括チェック</button>
                    <button class="btn btn-bulk-register hidden" id="btn-bulk-register" onclick="registerBulkBank()">登録</button>
                    <button class="btn btn-secondary" onclick="openSettings()">&#9881; 連携設定</button>
                    <button class="btn btn-danger"    onclick="resetAll()">リセット</button>
                </div>
            </div>
        </div>

        <!-- 集金リスト タブ -->
        <div id="tab-list">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="col-check">済</th>
                            <th>ルート</th>
                            <th class="col-month">月</th>
                            <th class="col-name">名前</th>
                            <th class="col-addr">住所</th>
                            <th class="col-amount">金額</th>
                            <th class="col-date">集金日</th>
                            <th class="col-transfer"></th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- 連絡事項 タブ -->
        <div id="tab-msg" class="hidden">
            <div class="msg-wrap">
                <div class="msg-form-section">
                    <div class="msg-form-title">&#128172; 連絡事項を入力</div>
                    <div class="msg-form-body">
                        <label class="msg-no-report-label">
                            <input type="checkbox" id="msg-no-report-check" onchange="onNoReportChange()">
                            <span>連絡事項なし</span>
                        </label>
                        <div id="msg-detail-fields">
                            <select id="msg-customer-select" class="msg-select" onchange="onMsgCustomerChange()">
                                <option value="">顧客を選択してください</option>
                            </select>
                            <select id="msg-type-select" class="msg-select msg-type-select">
                                <option value="">報告内容を選択してください</option>
                                <option value="別紙参照">別紙参照</option>
                                <option value="口座振替依頼書提出">口座振替依頼書提出</option>
                            </select>
                            <textarea id="msg-textarea" class="msg-textarea" placeholder="自由記入（省略可）" rows="3"></textarea>
                        </div>
                        <button class="btn btn-primary msg-submit-btn" onclick="submitMessage()">送信</button>
                    </div>
                </div>
                <div class="msg-list-section">
                    <div class="msg-form-title">送信済み一覧</div>
                    <div id="msg-sent-list"></div>
                </div>
            </div>
        </div>

        <!-- 集計 タブ -->
        <div id="tab-admin" class="hidden">
            <div class="admin-wrap">
                <div class="admin-section">
                    <div class="admin-title">集計表（ルート × 月）</div>
                    <div id="admin-content"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- ボトムナビ -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-list" onclick="switchTab('list')">
            <span class="nav-icon">&#128203;</span>
            <span class="nav-label">集金リスト</span>
        </button>
        <button class="nav-btn" id="nav-msg" onclick="switchTab('msg')">
            <span class="nav-icon">&#128172;</span>
            <span class="nav-label">連絡事項</span>
        </button>
        <button class="nav-btn" id="nav-admin" onclick="switchTab('admin')">
            <span class="nav-icon">&#128202;</span>
            <span class="nav-label">管理画面</span>
        </button>
    </div>

    <!-- 連携設定ダイアログ -->
    <dialog id="settings-dialog" class="settings-dialog">
        <div class="settings-inner">
            <div class="settings-title">&#9881; 連携設定</div>
            <p class="settings-desc">
                Google スプレッドシートの GAS ウェブアプリ URL を設定します。<br>
                未設定でもローカルで使用できます（チェック状態はこの端末に保存）。
            </p>
            <label class="settings-label">
                GAS URL
                <input id="settings-url-input" class="settings-input" type="url" placeholder="https://script.google.com/...">
            </label>
            <div id="settings-status" class="settings-status"></div>
            <div class="settings-actions">
                <button class="btn btn-secondary" onclick="closeSettings()">キャンセル</button>
                <button class="btn btn-primary"   onclick="saveSettings()">保存</button>
            </div>
        </div>
    </dialog>

    <!-- 現金精査ダイアログ -->
    <dialog id="denom-dialog" class="denom-dialog">
        <div class="denom-inner">
            <div class="denom-title" id="denom-title">💰 現金精査</div>
            <div class="denom-expected-row">
                手持ち現金（目標）: <strong id="denom-expected-amount">—</strong>
            </div>
            <input type="hidden" id="denom-expected-val" value="0">
            <div class="denom-panels">
                <div class="denom-panel">
                    <div class="denom-panel-title">紙幣</div>
                    <div id="denom-bills" class="denom-panel-body"></div>
                </div>
                <div class="denom-panel">
                    <div class="denom-panel-title">硬貨</div>
                    <div id="denom-coins" class="denom-panel-body"></div>
                </div>
            </div>
            <div class="denom-summary">
                <div class="denom-summary-row">
                    <span class="denom-summary-label">合計</span>
                    <span id="denom-total" class="denom-summary-value">¥0</span>
                </div>
                <div class="denom-summary-row denom-diff-row">
                    <span class="denom-summary-label">差額</span>
                    <span id="denom-diff" class="denom-diff-ng">—</span>
                </div>
            </div>
            <div class="denom-actions">
                <button class="btn btn-secondary" onclick="closeDenomDialog()">キャンセル</button>
                <button class="btn btn-primary"   onclick="saveDenomDialog()">保存</button>
            </div>
        </div>
    </dialog>

    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
