<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>集金管理アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>集金管理アプリ <span id="loading-badge" class="badge">読込中...</span></h1>
            <div class="controls">
                <button onclick="openSettings()">⚙ 連携設定</button>
            </div>
        </header>

        <div id="list-container">
            </div>
    </div>

    <script src="data.js" defer></script>
    <script src="app.js" defer></script>

    <script>
        function openSettings() {
            const current = localStorage.getItem('gas_url') || '';
            const url = prompt('GoogleスプレッドシートのURLを貼り付けてください:', current);
            if (url !== null) {
                localStorage.setItem('gas_url', url);
                location.reload();
            }
        }
    </script>
</body>
</html>
